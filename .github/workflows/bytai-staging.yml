name: Bytai - Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bytai-staging
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apply DEV D1 migrations
        if: ${{ vars.BYTAI_CF_ENABLED == 'true' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if compgen -G "migrations/*.sql" > /dev/null; then
            npx wrangler d1 migrations apply DB --remote --env dev
          else
            echo "No D1 migrations to apply."
          fi

      - name: Deploy Cloudflare staging
        if: ${{ vars.BYTAI_CF_ENABLED == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:dev

      - name: Cloudflare deployment is not enabled yet
        if: ${{ vars.BYTAI_CF_ENABLED != 'true' }}
        run: echo "Verification passed. Cloudflare deployment is disabled until BYTAI_CF_ENABLED=true."
